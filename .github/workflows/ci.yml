name: Typecheck and build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check Helmet callable CommonJS entrypoint
        working-directory: apps/api
        run: node -e "const factory = require('helmet'); if (typeof factory !== 'function' || typeof factory() !== 'function') process.exit(1)"
      - name: Type check apps
        run: npm run typecheck
      - name: Assistant behavior tests
        run: npm test
      - name: Production build
        run: npm run build
