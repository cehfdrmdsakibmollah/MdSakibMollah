name: Typecheck and build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Verify statically imported Helmet middleware
        run: |
          grep -Fq "import helmet from 'helmet';" apps/api/src/server.ts
          if grep -Fq "createRequire(import.meta.url)('helmet')" apps/api/src/server.ts; then
            echo 'Dynamic require of Helmet is unsupported in Vercel bundles.'
            exit 1
          fi
          node --input-type=module -e "import('helmet').then(m=>{if(typeof m.default !== 'function' || typeof m.default() !== 'function') process.exit(1)})"
      - name: Check Google Search Console static ownership file
        run: node scripts/check-google-ownership.mjs
      - name: Type check apps
        run: npm run typecheck
      - name: Assistant behavior tests
        run: npm test
      - name: Production build
        run: npm run build
