name: Live production smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test driver outside the app
        run: npm install --prefix /tmp/portfolio-smoke --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1
      - name: Ensure Chromium is available
        run: test -x /usr/bin/google-chrome
      - name: Check live Vercel, Render, chat chime, FAQ and anonymous security
        env:
          # Background music was removed; both PR and main check the live chat-open chime.
          EXPECT_CHAT_CHIME: '1'
        run: node scripts/live-production-smoke.mjs
      - name: Compare deployed Git revisions against GitHub main (report only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-deployed-revisions.mjs
